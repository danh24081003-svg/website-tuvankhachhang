<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập quản trị - Oshin Thời Đại</title>
    <link rel="stylesheet" href="/static/css/admin.css">
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-card">
        <div class="login-brand">
          <span>OT</span>
          <div>
            <strong>Oshin Thời Đại</strong>
            <small>Quản trị website</small>
          </div>
        </div>
        <form data-login-form autocomplete="off">
          <label>Tên đăng nhập / Email<input name="admin_email" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" readonly data-no-autofill required></label>
          <label>Mật khẩu<input name="admin_password" type="password" autocomplete="new-password" readonly data-no-autofill required></label>
          <button type="submit">ĐĂNG NHẬP</button>
          <p class="form-message" data-login-message role="status"></p>
        </form>
        <div style="display:flex;align-items:center;gap:12px;margin:24px 0 18px;color:var(--muted);font-size:0.82rem;font-weight:700;text-transform:uppercase;">
          <span style="height:1px;flex:1;background:var(--line);"></span>
          <span>Tài khoản admin</span>
          <span style="height:1px;flex:1;background:var(--line);"></span>
        </div>
        {% if google_configured %}
          <a class="google-login-btn" href="/auth/google/start?next=admin">
            <span aria-hidden="true">G</span>
            Đăng nhập bằng Google
          </a>
        {% else %}
          <p class="form-message">Google login chưa được cấu hình.</p>
        {% endif %}
        <div class="login-footer-links" style="margin-top: 24px; text-align: center; border-top: 1px solid var(--line, rgba(2, 26, 53, 0.08)); padding-top: 18px;">
          <a href="/" class="back-home-link" style="display: inline-flex; align-items: center; gap: 6px; color: var(--muted, #64748B); font-size: 0.9rem; font-weight: 600; text-decoration: none; transition: color 0.2s;">
            <span aria-hidden="true">←</span> Quay lại trang chủ
          </a>
        </div>
      </section>
    </main>
    <script src="/static/js/admin-login.js" defer></script>
  </body>
</html>
