<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 60" width="320" height="60" fill="none">
  <defs>
    <linearGradient id="goldBg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF0B3"/>
      <stop offset="40%" stop-color="#F3CA65"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A6B15"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D4AF37" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Logo Mark Squircle -->
  <g filter="url(#glow)">
    <rect x="6" y="6" width="48" height="48" rx="13" fill="url(#goldBg)"/>
    <rect x="6.5" y="6.5" width="47" height="47" rx="12.5" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1"/>
    
    <!-- Monogram OT & Sparkle -->
    <text x="30" y="37" font-family="'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="900" fill="#021A35" text-anchor="middle" letter-spacing="-0.5">OT</text>
    <path d="M44 11l1 2.5 2.5 1-2.5 1-1 2.5-1-2.5-2.5-1 2.5-1 1-2.5z" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- Typography -->
  <g font-family="'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Brand Title -->
    <text x="66" y="28" font-size="17" font-weight="800" fill="#FFFFFF" letter-spacing="0.04em">OSHIN THỜI ĐẠI</text>
    
    <!-- Subtitle & Slogan -->
    <text x="66" y="46" font-size="10.5" font-weight="700" fill="#F3CA65" letter-spacing="0.06em">ĐẤT PHƯƠNG NAM</text>
    <circle cx="162" cy="42.5" r="1.8" fill="rgba(255,255,255,0.4)"/>
    <text x="170" y="46" font-size="10" font-weight="400" font-style="italic" fill="rgba(255,255,255,0.75)">Khẳng định sự thành đạt</text>
  </g>
</svg>
